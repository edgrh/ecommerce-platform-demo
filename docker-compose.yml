# Base images from Docker Hub. If pull is slow in China, set Docker Desktop -> Settings -> Docker Engine
# registry-mirrors (e.g. your Aliyun mirror); avoid broken mirrors that return 401.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bcommerce
    # If 3307 is taken, use 3308 on host (update commerce datasource URL to match).
    ports:
      - "3308:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7-alpine
    # Host 6379 is often taken by a local Redis; use 6380 on host -> 6379 in container.
    ports:
      - "6380:6379"
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
