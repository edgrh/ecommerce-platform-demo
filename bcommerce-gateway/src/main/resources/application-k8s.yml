# Kubernetes：网关访问集群内 commerce；Redis 使用 Service redis:6379
spring:
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: commerce
          uri: http://bcommerce-commerce:8081
          predicates:
            - Path=/api/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 120
                redis-rate-limiter.burstCapacity: 240
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: commerceCb
                fallbackUri: forward:/fallback/503
