server:
  port: 8080

spring:
  application:
    name: bcommerce-gateway
  data:
    redis:
      host: localhost
      port: 6380
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "http://117.72.34.13"
              - "http://117.72.34.13:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: commerce
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/**
          filters:
            - name: RequestRateLimiter
              args:
                # 默认单机演示：按 IP 约 120/s。压测请用 profile=stress 或改 bcommerce.gateway.* 属性。
                redis-rate-limiter.replenishRate: ${bcommerce.gateway.rl-replenish:120}
                redis-rate-limiter.burstCapacity: ${bcommerce.gateway.rl-burst:240}
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: commerceCb
                fallbackUri: forward:/fallback/503

# 单机默认：放宽熔断，避免 commerce 短暂抖动后网关长时间返回 503。
resilience4j:
  timelimiter:
    instances:
      commerceCb:
        timeout-duration: 45s
  circuitbreaker:
    instances:
      commerceCb:
        sliding-window-size: 120
        minimum-number-of-calls: 40
        failure-rate-threshold: 80
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
