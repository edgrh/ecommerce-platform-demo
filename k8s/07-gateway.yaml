apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcommerce-gateway
  namespace: bcommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bcommerce-gateway
  template:
    metadata:
      labels:
        app: bcommerce-gateway
    spec:
      initContainers:
        - name: wait-commerce
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 90); do
                nc -z bcommerce-commerce 8081 && exit 0
                sleep 2
              done
              exit 1
      containers:
        - name: gateway
          image: bcommerce/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bcommerce-gateway
  namespace: bcommerce
spec:
  type: NodePort
  selector:
    app: bcommerce-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
