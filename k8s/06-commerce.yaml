apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcommerce-commerce
  namespace: bcommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bcommerce-commerce
  template:
    metadata:
      labels:
        app: bcommerce-commerce
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              for i in $(seq 1 120); do
                nc -z mysql 3306 && nc -z redis 6379 && nc -z rabbitmq 5672 && nc -z elasticsearch 9200 && exit 0
                echo "waiting deps... $i"
                sleep 2
              done
              exit 1
      containers:
        - name: commerce
          image: bcommerce/commerce:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: bcommerce-commerce
  namespace: bcommerce
spec:
  selector:
    app: bcommerce-commerce
  ports:
    - port: 8081
      targetPort: 8081
