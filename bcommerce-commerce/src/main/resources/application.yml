server:
  port: 8081

spring:
  application:
    name: bcommerce-commerce
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 15s
  datasource:
    url: jdbc:mysql://localhost:3308/bcommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 3s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

bcommerce:
  jwt:
    secret: "BCommerceDemoSecretKeyMustBeLongEnoughForHS256Algorithm________"
    expiration-ms: 86400000
  seckill:
    rate-per-minute: 30
  cache:
    product-list-ttl-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{userId:-}]"

resilience4j:
  circuitbreaker:
    instances:
      paymentMock:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
  timelimiter:
    instances:
      paymentMock:
        timeout-duration: 2s
